spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/user_auth_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: true
  profiles:
    active: dev
  config:
    import: "optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888"

server:
  port: 8081

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:5}
    refresh-token-minutes: ${JWT_REFRESH_TOKEN_MINUTES:10080}
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5p service=${spring.application.name} traceId=%X{traceId:-} spanId=%X{spanId:-} correlationId=%X{correlationId:-} thread=%t logger=%logger{36} msg=%m%n"

info:
  app:
    name: "auth-service"
    description: "auth-service microservice"
    version: "1.0.0"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
