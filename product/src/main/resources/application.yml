spring:
  application:
    name: product
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/product_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: true
  profiles:
    active: dev
  config:
    import: "optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888"
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      enable-auto-commit: false
      group-id: product-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed
        max.poll.interval.ms: 300000
        max.poll.records: 50
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
    listener:
      ack-mode: manual
      missing-topics-fatal: false
    properties:
      client.id: product-service-consumer

server:
  port: 8083

info:
  app:
    name: "product"
    description: "product microservice"
    version: "1.0.0"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5p service=${spring.application.name} traceId=%X{traceId:-} spanId=%X{spanId:-} correlationId=%X{correlationId:-} thread=%t logger=%logger{36} msg=%m%n"

app:
  kafka:
    idempotency:
      processed-ttl: 7d
      processing-lock-ttl: 5m

springdoc:
  swagger-ui:
    path: /swagger-ui.html
